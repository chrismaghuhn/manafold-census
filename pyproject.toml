[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manafold-census"
version = "0.1.0"
description = "Independent deterministic data-census foundations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<1"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.data-files]
"share/manafold-census/schemas" = ["schemas/*.json"]
"share/manafold-census/fixtures/source" = ["fixtures/source/example.txt"]
"share/manafold-census/fixtures/specs" = ["fixtures/specs/*.json"]
"share/manafold-census/fixtures/analysis" = ["fixtures/analysis/*.json"]
"share/manafold-census/fixtures/capability" = ["fixtures/capability/*.json"]
"share/manafold-census/config/sources" = ["config/sources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
files = ["src/manafold_census"]
no_implicit_optional = true
python_version = "3.12"
strict_equality = true
warn_return_any = true
