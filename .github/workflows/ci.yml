name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  task-01:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Run Ruff
        run: ruff check .
      - name: Run mypy
        run: mypy src/manafold_census
      - name: Run tests
        run: pytest
      - name: Check deterministic reproduction
        run: python -m manafold_census.cli reproduce
      - name: Check synthetic corpus reproduction
        run: python -m manafold_census.cli corpus-check --synthetic
      - name: Check synthetic structural reproduction
        run: python -m manafold_census.cli structural-check --synthetic
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheel"
      - name: Fresh non-editable wheel smoke
        run: |
          python -m venv "$RUNNER_TEMP/fresh-env"
          "$RUNNER_TEMP/fresh-env/bin/python" -m pip install "jsonschema>=4.23,<5"
          "$RUNNER_TEMP/fresh-env/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/wheel/manafold_census-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/fresh-env/bin/python" -c "from manafold_census.cli import doctor; from manafold_census.resources import project_data_root; root = project_data_root(); assert doctor() == 0; schema_names = ('source-artifact.v1.schema.json', 'structural-card.v1.schema.json', 'structural-card-index-manifest.v1.schema.json', 'structural-card-report.v1.schema.json', 'analysis-manifest.v1.schema.json', 'analysis-report.v1.schema.json', 'analysis-trace.v1.schema.json', 'card-analysis.v1.schema.json', 'negative-requirement-authority.v1.schema.json', 'pattern-registry.v1.schema.json', 'producer-registry.v1.schema.json'); fixture_names = ('golden-cards.json', 'negative-authority.v1.json', 'pattern-registry.v1.json'); assert all((root / 'schemas' / name).is_file() for name in schema_names); assert all((root / 'fixtures' / 'analysis' / name).is_file() for name in fixture_names)"
          "$RUNNER_TEMP/fresh-env/bin/python" -m manafold_census.cli corpus-check --synthetic
          "$RUNNER_TEMP/fresh-env/bin/python" -m manafold_census.cli structural-check --synthetic
