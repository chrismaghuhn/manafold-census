name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  task-01:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Run Ruff
        run: ruff check .
      - name: Run mypy
        run: mypy src/manafold_census
      - name: Run tests
        run: pytest
      - name: Check deterministic reproduction
        run: python -m manafold_census.cli reproduce
      - name: Check synthetic corpus reproduction
        run: python -m manafold_census.cli corpus-check --synthetic
      - name: Check synthetic structural reproduction
        run: python -m manafold_census.cli structural-check --synthetic
      - name: Build bounded synthetic M3
        run: python -m manafold_census.cli m3-build --synthetic
      - name: Check bounded synthetic M3
        run: python -m manafold_census.cli m3-check --synthetic
      - name: Report bounded synthetic M3
        run: python -m manafold_census.cli m3-report --synthetic
      - name: Build bounded synthetic M4
        run: python -m manafold_census.cli m4-build --synthetic
      - name: Check bounded synthetic M4
        run: python -m manafold_census.cli m4-check --synthetic
      - name: Report bounded synthetic M4
        run: python -m manafold_census.cli m4-report --synthetic
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheel"
      - name: Fresh non-editable wheel smoke
        run: |
          python -m venv "$RUNNER_TEMP/fresh-env"
          "$RUNNER_TEMP/fresh-env/bin/python" -m pip install "jsonschema>=4.23,<5" "rich>=13.7,<14"
          "$RUNNER_TEMP/fresh-env/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/wheel/manafold_census-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/fresh-env/bin/python" -c "import json; from manafold_census.cli import doctor; from manafold_census.resources import project_data_root; root = project_data_root(); assert doctor() == 0; schema_names = ('source-artifact.v1.schema.json', 'structural-card.v1.schema.json', 'structural-card-index-manifest.v1.schema.json', 'structural-card-report.v1.schema.json', 'analysis-manifest.v1.schema.json', 'analysis-report.v1.schema.json', 'analysis-trace.v1.schema.json', 'card-analysis.v1.schema.json', 'negative-requirement-authority.v1.schema.json', 'pattern-registry.v1.schema.json', 'producer-registry.v1.schema.json', 'capability-claim.v1.schema.json', 'capability-definition.v1.schema.json', 'capability-evolution.v1.schema.json', 'capability-ontology-manifest.v1.schema.json', 'capability-relations.v1.schema.json', 'capability-review.v1.schema.json', 'capability-candidate-cluster.v1.schema.json', 'candidate-grouping-policy.v1.schema.json', 'requirement-capability-link.v1.schema.json', 'requirement-mapping-decision.v1.schema.json', 'source-requirement-admissibility.v1.schema.json', 'capability-report.v1.schema.json'); fixture_names = ('golden-cards.json', 'negative-authority.v1.json', 'pattern-registry.v1.json'); capability_fixture_names = ('synthetic-m4-fixture.v1.json',); assert all((root / 'schemas' / name).is_file() for name in schema_names); assert all((root / 'fixtures' / 'analysis' / name).is_file() for name in fixture_names); assert all((root / 'fixtures' / 'capability' / name).is_file() for name in capability_fixture_names); assert all(json.loads((root / 'fixtures' / 'capability' / name).read_text(encoding='utf-8'))['real_corpus'] is False for name in capability_fixture_names); assert all(json.loads((root / 'fixtures' / 'capability' / name).read_text(encoding='utf-8'))['real_requirement_mapping'] is False for name in capability_fixture_names); assert all(json.loads((root / 'fixtures' / 'capability' / name).read_text(encoding='utf-8'))['real_capability_activation'] is False for name in capability_fixture_names)"
          "$RUNNER_TEMP/fresh-env/bin/python" -m manafold_census.cli corpus-check --synthetic
          "$RUNNER_TEMP/fresh-env/bin/python" -m manafold_census.cli structural-check --synthetic
